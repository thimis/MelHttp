# One container per test site, all from the same image.
#
#   docker compose up --build -d --wait
#     http://localhost:8080  Angular Material showcase (with /_source/ enabled)
#     http://localhost:8081  classic multi-page site
#     http://localhost:8082  MelCGI demos (dynamic programs)
#     http://localhost:8083  hello world
#     http://localhost:8084  React (Vite)
#     http://localhost:8085  Vue (Vite)
#     http://localhost:8086  Malbolge transport (pages travel as Malbolge; reload once) + /_melhttp/playground.html
#     http://localhost:8087  WASI handlers (/hello.html is Go compiled to WebAssembly)
#
#   docker compose up -d --wait angular-transport
#     http://localhost:8088  the Angular showcase over the Malbolge transport (reload once)
#
# Compile your own site without installing Go:
#   docker compose run --rm melc build -o /work/site /work/my-site

x-melhttp: &melhttp
  build:
    context: .
    args:
      VERSION: local
  image: melhttp:local
  read_only: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  angular:
    <<: *melhttp
    environment:
      MELHTTP_ROOT: /srv/sites/angular
      MELHTTP_EXPOSE_SOURCE: "true"
    ports: ["8080:8080"]
  classic:
    <<: *melhttp
    environment: { MELHTTP_ROOT: /srv/sites/classic }
    ports: ["8081:8080"]
  cgi:
    <<: *melhttp
    environment: { MELHTTP_ROOT: /srv/sites/cgi }
    ports: ["8082:8080"]
  hello:
    <<: *melhttp
    environment: { MELHTTP_ROOT: /srv/sites/hello }
    ports: ["8083:8080"]
  react:
    <<: *melhttp
    environment: { MELHTTP_ROOT: /srv/sites/react }
    ports: ["8084:8080"]
  vue:
    <<: *melhttp
    environment: { MELHTTP_ROOT: /srv/sites/vue }
    ports: ["8085:8080"]
  obfuscated:
    <<: *melhttp
    environment:
      MELHTTP_ROOT: /srv/sites/obfuscated
      MELHTTP_OBFUSCATE: "true"
      MELHTTP_PLAYGROUND: "true"
    ports: ["8086:8080"]
  wasi:
    <<: *melhttp
    environment:
      MELHTTP_ROOT: /srv/sites/wasi
      MELHTTP_WASI: "true"
    ports: ["8087:8080"]

  # The Angular showcase over the Malbolge transport (reload once):
  #   docker compose up --build -d --wait angular-transport   → http://localhost:8088
  angular-transport:
    <<: *melhttp
    profiles: ["transport"]
    environment:
      MELHTTP_ROOT: /srv/sites/angular
      MELHTTP_EXPOSE_SOURCE: "true"
      MELHTTP_OBFUSCATE_INJECT: "true"
    ports: ["8088:8080"]

  # The compiler as a tool: docker compose run --rm melc build -o /work/site /work/my-site
  melc:
    image: melhttp:local
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/melc"]
    working_dir: /work
    volumes: ["./:/work"]
    user: "${UID:-1000}:${GID:-1000}"

  # Public HTTPS with automatic Let's Encrypt certificates. Point DNS for your
  # domain at this host, make ports 80 and 443 reachable, then:
  #   MELHTTP_DOMAIN=example.com MELHTTP_EMAIL=you@example.com docker compose --profile https up -d
  https:
    <<: *melhttp
    profiles: ["https"]
    environment:
      MELHTTP_ROOT: /srv/sites/angular
      MELHTTP_ACME_DOMAINS: ${MELHTTP_DOMAIN:-}  # required for this profile
      MELHTTP_ACME_EMAIL: ${MELHTTP_EMAIL:-}
      MELHTTP_HTTPS_PORT: "443"
      MELHTTP_HSTS: 8760h
    ports: ["80:8080", "443:8443"]
    volumes: ["melhttp-certs:/var/lib/melhttp/certs"]

volumes:
  melhttp-certs:
